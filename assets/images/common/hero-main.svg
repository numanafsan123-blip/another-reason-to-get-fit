<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#heroGrad)" />
  <circle cx="950" cy="337" r="280" fill="white" opacity="0.04" />
  <circle cx="1050" cy="400" r="160" fill="white" opacity="0.05" />
  
  <!-- Barbell Graphic -->
  <g transform="translate(680, 260)">
    <!-- Bar -->
    <rect x="0" y="70" width="460" height="16" rx="8" fill="#e2e8f0" />
    <!-- Weight plates left -->
    <rect x="70" y="20" width="22" height="116" rx="6" fill="#1e293b" />
    <rect x="96" y="30" width="18" height="96" rx="5" fill="#334155" />
    <rect x="118" y="45" width="14" height="66" rx="4" fill="#64748b" />
    <!-- Weight plates right -->
    <rect x="368" y="20" width="22" height="116" rx="6" fill="#1e293b" />
    <rect x="346" y="30" width="18" height="96" rx="5" fill="#334155" />
    <rect x="328" y="45" width="14" height="66" rx="4" fill="#64748b" />
  </g>

  <!-- Content Elements -->
  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="260" height="40" rx="20" fill="url(#accentGrad)" />
    <text x="20" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1">EVIDENCE-BASED FITNESS</text>
    
    <text x="0" y="110" fill="#ffffff" font-family="system-ui, sans-serif" font-size="52" font-weight="800">Another Reason</text>
    <text x="0" y="170" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="52" font-weight="800">To Get Fit.</text>
    
    <text x="0" y="225" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="20" font-weight="400">Structured Lifting Pathways &amp; Realistic Indian Nutrition</text>
  </g>
</svg>
